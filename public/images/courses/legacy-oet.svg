<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#172a45" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="700" cy="80" r="160" fill="#d4af37" opacity="0.06" />
  <circle cx="100" cy="420" r="140" fill="#d4af37" opacity="0.05" />
  
  <g transform="translate(50, 60)">
    <rect width="240" height="34" rx="17" fill="rgba(212,175,55,0.15)" stroke="#d4af37" stroke-width="1" />
    <text x="120" y="22" fill="#d4af37" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="1">HEALTHCARE OET</text>
  </g>

  <g transform="translate(50, 150)">
    <text x="0" y="40" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800">OET Occupational English Test</text>
    <text x="0" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Authorised Healthcare Professional Preparation</text>
  </g>

  <g transform="translate(50, 320)">
    <rect width="700" height="120" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="40" y="45" fill="#d4af37" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold">Cambridge Academy of English</text>
    <text x="40" y="75" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="14">★ 21 Years of Excellence • Bangalore Campus &amp; Online Live</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">Authorised Test Preparation &amp; Certified International Faculty</text>
  </g>
