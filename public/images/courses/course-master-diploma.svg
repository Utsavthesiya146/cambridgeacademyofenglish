<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg-course-master-diploma.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glow-course-master-diploma.svg" cx="75%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg-course-master-diploma.svg)"/>
  <rect width="800" height="500" fill="url(#glow-course-master-diploma.svg)"/>
  
  <!-- Subtle decorative grid -->
  <g stroke="white" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  
  <!-- Institution branding pill -->
  <rect x="50" y="50" width="280" height="34" rx="17" fill="white" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="68" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5">CAMBRIDGE ACADEMY</text>
  
  <!-- Category badge -->
  <rect x="50" y="105" width="220" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3"/>
  <text x="68" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#10b981" letter-spacing="1">FOREIGN NATIONALS</text>
  
  <!-- Large Central Emoji Icon -->
  <text x="660" y="270" font-size="110" text-anchor="middle" opacity="0.9">🌍</text>
  
  <!-- Course Title -->
  <text x="50" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Master Diploma in English ...
  </text>
  
  <!-- CEFR Level / Outcome pill -->
  <g transform="translate(50, 300)">
    <rect width="360" height="44" rx="12" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.15"/>
    <circle cx="24" cy="22" r="5" fill="#10b981"/>
    <text x="42" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1-Year Complete Academic Immersion</text>
  </g>
  
  <!-- Bottom trust badge -->
  <text x="50" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
    ✓ 21 Years of Excellence • Cambridge Certified Faculty • Bangalore Campus &amp; Online
  </text>
</svg>