<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="32" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.6" />
  <circle cx="200" cy="200" r="125" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
  
  <!-- Academic Crest / Laurels -->
  <g transform="translate(200, 150) scale(1.2)">
    <!-- Central Shield / Book -->
    <path d="M-30,-20 C-30,-20 0,-30 30,-20 C30,20 20,50 0,65 C-20,50 -30,20 -30,-20 Z" fill="rgba(212,175,55,0.15)" stroke="url(#goldGrad)" stroke-width="2.5" />
    <path d="M0,-25 L0,60" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="0" y="20" fill="#d4af37" font-family="serif" font-size="28" font-weight="bold" text-anchor="middle">C</text>
  </g>

  <!-- Star Emblems -->
  <g fill="#d4af37" transform="translate(200, 260)">
    <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(-30, 0) scale(0.8)" />
    <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(0, -6) scale(1.1)" />
    <polygon points="0,-10 3,-3 10,-3 5,2 7,9 0,5 -7,9 -5,2 -10,-3 -3,-3" transform="translate(30, 0) scale(0.8)" />
  </g>

  <!-- Typography -->
  <text x="200" y="305" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">CAMBRIDGE ACADEMY</text>
  <text x="200" y="325" fill="#d4af37" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">OF ENGLISH • ESTD 2005</text>
  <text x="200" y="350" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">ACADEMIC GOVERNANCE &amp; EXCELLENCE</text>
</svg>

